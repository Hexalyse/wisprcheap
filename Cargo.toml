[package]
name = "wisprcheap"
version = "1.5.2"
edition = "2024"
rust-version = "1.92"
license = "MIT"
description = "Push-to-talk dictation: hold a hotkey, speak, and the cleaned-up text is pasted where you type."
default-run = "wisprcheap"

# A plain build produces the dictation executables and the optional companion.
# The background package has no Iced dependency; the sync server stays opt-in.
[workspace]
members = ["sync", "server", "desktop-ui"]
default-members = [".", "desktop-ui"]

[[bin]]
name = "wisprcheap"
path = "src/main.rs"

# Same program built as a Windows GUI-subsystem executable: no console window
# (used by the desktop shortcut and for the background instance).
[[bin]]
name = "wisprcheapw"
path = "src/bin/wisprcheapw.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
chrono = "0.4"
cpal = "0.18"
dirs = "7"
dotenvy = "0.15"
notify = "8"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "http2", "charset", "system-proxy"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
serde_yaml = "0.9"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tray-icon = { version = "0.26", default-features = false }
uuid = { version = "1.26", features = ["v4", "v5"] }
wisprcheap-sync = { path = "sync" }

[dev-dependencies]
# tests/sync.rs runs the real sync server in-process.
axum = "0.8"
wisprcheap-server = { path = "server" }

[target.'cfg(windows)'.dependencies]
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
gtk = { package = "gtk4", version = "0.11" }
gtk-layer-shell = { package = "gtk4-layer-shell", version = "0.8" }
gdk4-x11 = { version = "0.11", features = ["v4_4"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
x11rb = "0.13"
notify-rust = "4"
rdev = "0.5"

[target.'cfg(target_os = "linux")'.dev-dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
lto = "thin"
strip = true

# Argon2 (sync passphrase) is unbearably slow unoptimised; keep debug builds and tests usable.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
