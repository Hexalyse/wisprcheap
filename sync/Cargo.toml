[package]
name = "wisprcheap-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared sync code for wisprcheap: end-to-end encryption, hybrid logical clock, wire protocol, profile records, pricing."
publish = false

[dependencies]
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
