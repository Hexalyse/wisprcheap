<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>{% block title %}WisprCheap sync{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">WisprCheap <span>sync</span></a>
  {% if let Some(u) = nav %}
  <nav>
    <a href="/">Dashboard</a>
    <a href="/history">History</a>
    <a href="/devices">Devices</a>
    <a href="/account">Account</a>
    {% if u.is_admin %}<a href="/admin">Admin</a>{% endif %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ u.csrf }}">
      <button class="link">Log out ({{ u.username }})</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>WisprCheap sync server {{ version }}</footer>
</body>
</html>
