{% extends "base.html" %}
{% block title %}{{ title }} · WisprCheap sync{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ title }}</h1>
  <p class="muted">{{ intro }}</p>
  {% if let Some(e) = error %}<p class="error">{{ e }}</p>{% endif %}
  <form method="post" action="{{ action }}">
    {% if let Some(t) = token %}<input type="hidden" name="token" value="{{ t }}">{% endif %}
    {% if ask_username %}
    <label>Username <input name="username" autocomplete="username" required value="{{ username }}"></label>
    {% endif %}
    <label>Password <input name="password" type="password" autocomplete="new-password" required minlength="12"></label>
    <label>Confirm the password <input name="confirm" type="password" autocomplete="new-password" required minlength="12"></label>
    <button>{{ button }}</button>
  </form>
</section>
{% endblock %}
