[package]
name = "wisprcheap-server"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Self-hostable sync server for wisprcheap (desktop and Android)."
publish = false

[dependencies]
wisprcheap-sync = { path = "../sync" }
anyhow = "1"
argon2 = "0.6"
askama = "0.16"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rpassword = "7"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
