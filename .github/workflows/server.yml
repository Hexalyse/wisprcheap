# Tests the sync crate and the server on every change to them; on a `server-vX.Y.Z` tag, also publishes
# the Docker image (ghcr.io/<owner>/wisprcheap-server) and a static Linux binary as a GitHub release.
# Release: bump `version` in server/Cargo.toml, commit, then `git tag server-vX.Y.Z && git push origin server-vX.Y.Z`.
name: Server

on:
  push:
    branches: [main]
    paths: ["sync/**", "server/**", "Cargo.lock", ".github/workflows/server.yml"]
    tags: ["server-v*"]
  pull_request:
    paths: ["sync/**", "server/**", "Cargo.lock", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the sync crate and the server
        run: cargo test --locked -p wisprcheap-sync -p wisprcheap-server

  release:
    name: Publish
    if: startsWith(github.ref, 'refs/tags/server-v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches server/Cargo.toml
        run: |
          version=$(grep -m1 '^version' server/Cargo.toml | cut -d'"' -f2)
          if [ "server-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match server/Cargo.toml version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wisprcheap-server" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

      - name: Extract the static binary
        run: |
          docker create --name extract "$IMAGE:$VERSION"
          docker cp extract:/usr/local/bin/wisprcheap-server wisprcheap-server
          docker rm extract
          tar czf "wisprcheap-server-$VERSION-linux-x86_64.tar.gz" wisprcheap-server server/wisprcheap-server.service server/docker-compose.example.yml
          sha256sum *.tar.gz > SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wisprcheap-server-*.tar.gz SHA256SUMS.txt \
            --title "wisprcheap sync server $VERSION" \
            --notes "Docker image: \`$IMAGE:$VERSION\`. See server/README.md to deploy." \
            --latest=false
