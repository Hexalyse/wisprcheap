name: Desktop

on:
  push:
    branches: [master]
    paths: ["src/**", "desktop-ui/**", "tests/**", "sync/**", "server/**", "build.rs", "Cargo.toml", "Cargo.lock", ".github/scripts/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["src/**", "desktop-ui/**", "tests/**", "sync/**", "server/**", "build.rs", "Cargo.toml", "Cargo.lock", ".github/scripts/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Check dependency policy
        run: python tests/dependency_policy.py
      - name: Test native X11 overlay
        if: runner.os == 'Linux'
        run: python3 tests/x11_overlay.py
      - name: Test GTK-free tray
        if: runner.os == 'Linux'
        run: python3 tests/ksni_tray.py
      - name: Test native Wayland overlay
        if: runner.os == 'Linux'
        run: python3 tests/wayland_overlay.py
