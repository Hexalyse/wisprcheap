# Builds Windows and Linux binaries and publishes them as a GitHub release.
# Release: bump Cargo.toml versions, add docs/releases/vX.Y.Z.md, commit, then tag and push vX.Y.Z.
# Running it manually (Actions > Release > Run workflow) only builds the archives, without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x86_64
            os: windows-2025
            # Static CRT: no dependency on the Visual C++ Redistributable.
            rustflags: -C target-feature=+crt-static
          - name: linux-x86_64
            # GTK4 build baseline (glibc 2.39); GTK4 Layer Shell is built from a pinned revision.
            os: ubuntu-24.04
            rustflags: ""
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          bash .github/scripts/install-linux-deps.sh

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Test Wayland overlay
        if: runner.os == 'Linux'
        run: python3 tests/wayland_overlay.py --release

      - name: Test X11 overlay
        if: runner.os == 'Linux'
        run: python3 tests/x11_overlay.py --release

      - name: Test GTK-free tray
        if: runner.os == 'Linux'
        run: python3 tests/ksni_tray.py --release

      - name: Check dependency policy
        run: python tests/dependency_policy.py

      - name: Build
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "wisprcheap-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/wisprcheap.exe, target/release/wisprcheapw.exe, target/release/wisprcheap-ui.exe, README.md, LICENSE, config.example.yaml, .env.example "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="wisprcheap-$GITHUB_REF_NAME-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp target/release/wisprcheap target/release/wisprcheap-ui README.md LICENSE config.example.yaml .env.example "dist/$name/"
          mkdir -p "dist/$name/lib"
          layer_libdir=$(pkg-config --variable=libdir gtk4-layer-shell-0)
          cp -L "$layer_libdir/libgtk4-layer-shell.so.0" "dist/$name/lib/"
          cp /usr/local/share/licenses/gtk4-layer-shell/LICENSE "dist/$name/lib/gtk4-layer-shell-LICENSE.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
